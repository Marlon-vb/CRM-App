<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence</title>
    <script>
      // No-flash theme bootstrap — runs before React mounts.
      // Dark is the default. Saved preference always wins; system
      // preference does not flip us to light automatically.
      // (Tailwind is a build dep now — no CDN script; dark: variants are
      // wired to [data-theme="dark"] in tailwind.config.js.)
      (function () {
        try {
          var saved = localStorage.getItem('cadence-theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
